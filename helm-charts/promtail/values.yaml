# Promtail Helm values for LogSentinel experiment environment
# 采集所有 K8s Pod 的 stdout/stderr，推送到 logsentinel namespace 的 Loki

config:
  clients:
    - url: http://logsentinel-loki.logsentinel:3100/loki/api/v1/push

  scrape_configs:
    - job_name: kubernetes-pods
      kubernetes_sd_configs:
        - role: pod
      pipeline_stages:
        - docker: {}
      relabel_configs:
        # 保留 namespace label
        - source_labels: [__meta_kubernetes_namespace]
          target_label: namespace
        # 保留 pod label
        - source_labels: [__meta_kubernetes_pod_name]
          target_label: pod
        # 保留 container label
        - source_labels: [__meta_kubernetes_pod_container_name]
          target_label: container
        # 保留 app label（来自 Pod label app 或 app.kubernetes.io/name）
        - source_labels: [__meta_kubernetes_pod_label_app]
          target_label: app
          regex: (.+)
        - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_name]
          target_label: app
          regex: (.+)
        # job label（namespace/pod_name 格式，便于 LogQL 过滤）
        - source_labels: [__meta_kubernetes_namespace, __meta_kubernetes_pod_name]
          separator: "/"
          target_label: job
        # 日志文件路径
        - source_labels: [__meta_kubernetes_pod_uid, __meta_kubernetes_pod_container_name]
          target_label: __path__
          replacement: /var/log/pods/*$1*/$2/*.log

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 200m
    memory: 128Mi

tolerations:
  - effect: NoSchedule
    operator: Exists

# 挂载宿主机日志目录
volumes:
  - name: varlog
    hostPath:
      path: /var/log
  - name: varlibdockercontainers
    hostPath:
      path: /var/lib/docker/containers

volumeMounts:
  - name: varlog
    mountPath: /var/log
    readOnly: true
  - name: varlibdockercontainers
    mountPath: /var/lib/docker/containers
    readOnly: true
